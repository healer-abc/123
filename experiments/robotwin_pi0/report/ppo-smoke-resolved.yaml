actor:
  model:
    model_type: openpi
    precision: null
    pi05: false
    is_lora: false
    lora_rank: 32
    num_action_chunks: 50
    action_dim: 14
    use_proprio: true
    num_steps: 4
    add_value_head: true
    openpi:
      task: rl
      config_name: pi0_aloha_robotwin
      num_images_in_input: 3
      noise_level: 0.5
      action_chunk: 50
      num_steps: 4
      train_expert_only: true
      action_env_dim: 14
      noise_method: flow_sde
      add_value_head: true
      detach_critic_input: true
      model_action_dim: 32
      paligemma_variant: gemma_2b
      action_expert_variant: gemma_300m
      max_token_len: 48
      discrete_state_input: false
      torch_compile: false
    model_path: /home/zhsu/jyluo/models/robotwin_pi0/RLinf-Pi0-RoboTwin-SFT-adjust_bottle
    openpi_data:
      norm_stats_path: /home/zhsu/jyluo/models/robotwin_pi0/RLinf-Pi0-RoboTwin-SFT-adjust_bottle/physical-intelligence/robotwin/norm_stats.json
  fsdp_config:
    strategy: fsdp
    sharding_strategy: full_shard
    gradient_checkpointing: true
    cpu_offload: false
    offload_pin_memory: false
    reshard_after_forward: true
    enable_gradient_accumulation: true
    forward_prefetch: false
    limit_all_gathers: false
    backward_prefetch: null
    use_orig_params: false
    use_liger_kernel: false
    mixed_precision:
      param_dtype: null
      reduce_dtype: null
      buffer_dtype: null
    wrappers: {}
    mixed_precision_policies: {}
    mixed_precision_rules: {}
    amp_autocast:
      enabled: false
      precision: bf16
    grad_scaler:
      enabled: false
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 2
  global_batch_size: 32
  seed: 1234
  enable_offload: true
  optim:
    lr: 5.6e-06
    value_lr: 0.00011
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0
    critic_warmup_steps: 0
weight_syncer:
  type: patch
  patch:
    snapshot_device: cpu
    delta_encoding: true
    compression: none
    init_sync:
      enabled: true
      prefixes: null
      bucket_size: 134217728
cluster:
  num_nodes: 1
  component_placement:
    actor, env, rollout: 0-1
runner:
  task_type: embodied
  logger:
    log_path: /home/zhsu/jyluo/experiments/robotwin_pi0/runs/ppo_smoke
    project_name: rlinf
    experiment_name: robotwin_pi0_ppo_smoke_2gpu
    logger_backends:
    - tensorboard
  max_epochs: 1
  max_steps: -1
  only_eval: false
  val_check_interval: -1
  save_interval: 1
  resume_dir: null
  ckpt_path: null
algorithm:
  normalize_advantages: true
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level
  update_epoch: 1
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: token-mean
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  filter_rewards: false
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9
rollout:
  group_name: RolloutGroup
  backend: huggingface
  recompute_logprobs: false
  enable_offload: true
  pipeline_stage_num: 1
  model:
    model_path: /home/zhsu/jyluo/models/robotwin_pi0/RLinf-Pi0-RoboTwin-SFT-adjust_bottle
    precision: null
reward:
  use_reward_model: false
critic:
  use_critic_model: false
