env:
  eval:
    env_type: robotwin
    total_num_envs: 2
    auto_reset: true
    ignore_terminations: true
    reward_coef: 1.0
    use_custom_reward: true
    use_rel_reward: true
    center_crop: false
    seed: 0
    group_size: 1
    use_fixed_reset_state_ids: true
    max_steps_per_rollout_epoch: 200
    max_episode_steps: 200
    is_eval: true
    assets_path: /home/zhsu/jyluo/projects/RoboTwin
    seeds_path: /home/zhsu/jyluo/projects/RLinf/rlinf/envs/sim/robotwin/seeds/eval_seeds.json
    video_cfg:
      save_video: true
      info_on_video: true
      video_base_dir: /home/zhsu/jyluo/experiments/robotwin_pi0/runs/eval_smoke/video/eval
    enable_offload: false
    task_config:
      task_name: adjust_bottle
      step_lim: 200
      planner_backend: mplib
      render_freq: 0
      episode_num: 100
      use_seed: false
      save_freq: 15
      embodiment:
      - aloha-agilex
      language_num: 100
      domain_randomization:
        random_background: false
        cluttered_table: false
        clean_background_rate: 1
        random_head_camera_dis: 0
        random_table_height: 0
        random_light: false
        crazy_random_light_rate: 0
      camera:
        head_camera_type: D435
        wrist_camera_type: D435
        collect_head_camera: true
        collect_wrist_camera: true
      data_type:
        rgb: true
        third_view: false
        depth: false
        pointcloud: false
        observer: false
        endpose: false
        qpos: true
        mesh_segmentation: false
        actor_segmentation: false
      pcd_down_sample_num: 1024
      pcd_crop: true
      save_path: /home/zhsu/jyluo/data/robotwin_pi0/smoke
      clear_cache_freq: 1
      collect_data: true
      eval_video_log: true
    rollout_epoch: 1
  group_name: EnvGroup
  enable_offload: true
cluster:
  num_nodes: 1
  component_placement:
    env, rollout: 0-1
runner:
  task_type: embodied_eval
  logger:
    log_path: /home/zhsu/jyluo/experiments/robotwin_pi0/runs/eval_smoke
    project_name: rlinf
    experiment_name: robotwin_pi0_eval_smoke_2gpu
    logger_backends:
    - tensorboard
  max_epochs: 1
  max_steps: -1
  only_eval: true
  val_check_interval: -1
  save_interval: -1
  resume_dir: null
  ckpt_path: null
rollout:
  group_name: RolloutGroup
  backend: huggingface
  recompute_logprobs: false
  enable_offload: true
  pipeline_stage_num: 1
  model:
    model_type: openpi
    model_path: /home/zhsu/jyluo/models/robotwin_pi0/RLinf-Pi0-RoboTwin-SFT-adjust_bottle
    precision: bf16
    is_lora: false
    lora_rank: 32
    pi05: false
    num_action_chunks: 50
    action_dim: 14
    use_proprio: true
    num_steps: 5
    add_value_head: false
    openpi_data:
      norm_stats_path: /home/zhsu/jyluo/models/robotwin_pi0/RLinf-Pi0-RoboTwin-SFT-adjust_bottle/physical-intelligence/robotwin/norm_stats.json
    openpi:
      task: eval
      config_name: pi0_aloha_robotwin
      num_images_in_input: 3
      action_chunk: 50
      action_env_dim: 14
      model_action_dim: 32
      paligemma_variant: gemma_2b
      action_expert_variant: gemma_300m
      discrete_state_input: false
      torch_compile: false
