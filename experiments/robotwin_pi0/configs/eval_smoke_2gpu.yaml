defaults:
- env/robotwin_adjust_bottle@env.eval
- override hydra/job_logging: stdout
- _self_
hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
  - file://${oc.env:EMBODIED_PATH}/config/
cluster:
  num_nodes: 1
  component_placement:
    env, rollout: 0-1
runner:
  task_type: embodied_eval
  logger:
    log_path: /home/zhsu/jyluo/experiments/robotwin_pi0/runs/eval_smoke
    project_name: rlinf
    experiment_name: robotwin_pi0_eval_smoke_2gpu
    logger_backends:
    - tensorboard
  max_epochs: 1
  max_steps: -1
  only_eval: true
  val_check_interval: -1
  save_interval: -1
  resume_dir: null
  ckpt_path: null
env:
  group_name: EnvGroup
  enable_offload: true
  eval:
    rollout_epoch: 1
    total_num_envs: 2
    auto_reset: true
    ignore_terminations: true
    max_episode_steps: 200
    reward_coef: 1.0
    max_steps_per_rollout_epoch: 200
    group_size: 1
    use_fixed_reset_state_ids: true
    is_eval: true
    assets_path: /home/zhsu/jyluo/projects/RoboTwin
    seeds_path: ${oc.env:REPO_PATH}/rlinf/envs/sim/robotwin/seeds/eval_seeds.json
    video_cfg:
      save_video: true
      video_base_dir: ${runner.logger.log_path}/video/eval
    center_crop: false
    task_config:
      embodiment:
      - aloha-agilex
      camera:
        collect_wrist_camera: true
      domain_randomization:
        random_background: false
        cluttered_table: false
        clean_background_rate: 1
        random_head_camera_dis: 0
        random_table_height: 0
        random_light: false
        crazy_random_light_rate: 0
      save_path: /home/zhsu/jyluo/data/robotwin_pi0/smoke
rollout:
  group_name: RolloutGroup
  backend: huggingface
  recompute_logprobs: false
  enable_offload: true
  pipeline_stage_num: 1
  model:
    model_type: openpi
    model_path: /home/zhsu/jyluo/models/robotwin_pi0/RLinf-Pi0-RoboTwin-SFT-adjust_bottle
    precision: bf16
    is_lora: false
    lora_rank: 32
    pi05: false
    num_action_chunks: 50
    action_dim: 14
    use_proprio: true
    num_steps: 5
    add_value_head: false
    openpi_data:
      norm_stats_path: /home/zhsu/jyluo/models/robotwin_pi0/RLinf-Pi0-RoboTwin-SFT-adjust_bottle/physical-intelligence/robotwin/norm_stats.json
    openpi:
      task: eval
      config_name: pi0_aloha_robotwin
      num_images_in_input: 3
      action_chunk: ${..num_action_chunks}
      action_env_dim: ${..action_dim}
      model_action_dim: 32
      paligemma_variant: gemma_2b
      action_expert_variant: gemma_300m
      discrete_state_input: false
      torch_compile: false
