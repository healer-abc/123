defaults:
- model/pi0@actor.model
- hybrid_engines/openpi_fsdp@actor.fsdp_config
- override hydra/job_logging: stdout
- _self_
hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
  - file://${oc.env:RLINF_ROOT}/examples/sft/config/
  - file://${oc.env:EMBODIED_PATH}/config/
cluster:
  num_nodes: 1
  component_placement:
    actor: 0-1
runner:
  task_type: sft
  logger:
    log_path: /home/zhsu/jyluo/experiments/robotwin_pi0/runs/sft_smoke
    project_name: rlinf
    experiment_name: profile_b
    logger_backends:
    - tensorboard
  max_epochs: -1
  max_steps: 5
  val_check_interval: -1
  save_interval: -1
  resume_dir: null
data:
  train_data_paths: /home/zhsu/jyluo/data/robotwin_pi0/lerobot/local/robotwin_pi0_clean200
  num_workers: 2
actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 2
  global_batch_size: 16
  seed: 0
  model:
    precision: fp32
    model_path: /home/zhsu/jyluo/models/robotwin_pi0/RLinf-Pi0-RoboTwin-SFT-adjust_bottle
    num_action_chunks: 50
    action_dim: 14
    add_value_head: false
    openpi:
      embed_dtype: bf16
      task: sft
      config_name: pi0_aloha_robotwin
      num_images_in_input: 3
      torch_compile: false
    openpi_data:
      norm_stats_path: /home/zhsu/jyluo/experiments/robotwin_pi0/report/clean200_norm_stats/norm_stats.json
    is_lora: true
    lora_rank: 8
    lora_target_scope: all_linear
  optim:
    lr: 2.5e-05
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 1.0e-10
    clip_grad: 1.0
    total_training_steps: 10000
    lr_warmup_steps: 500
    lr_scheduler: openpi_cosine
    num_cycles: 0.5
    min_lr: 2.5e-06
  fsdp_config:
    strategy: fsdp
    sharding_strategy: full_shard
    use_orig_params: true
    gradient_checkpointing: true
    gradient_checkpointing_use_reentrant: false
    wrappers:
      state_projection:
        module_names:
        - state_proj
      projections:
        module_names:
        - action_in_proj
        - action_out_proj
        - action_time_mlp_in
        - action_time_mlp_out
      lora_adapters:
        module_names:
        - '*.lora_A.default'
        - '*.lora_B.default'
      projection_bases:
        module_names:
        - state_proj.base_layer
        - action_in_proj.base_layer
        - action_out_proj.base_layer
        - action_time_mlp_in.base_layer
        - action_time_mlp_out.base_layer
    mixed_precision_rules:
      state_projection: fp32
      lora_adapters: fp32
      projection_bases: fp32
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: fp32
      buffer_dtype: fp32
    save_full_model_weights: false
reward:
  use_reward_model: false
critic:
  use_critic_model: false
